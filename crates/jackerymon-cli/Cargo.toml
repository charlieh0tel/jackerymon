[package]
name = "jackerymon-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "jackerymon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
jackerymon = { version = "0.1.0", path = "../jackerymon" }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }

[lints]
workspace = true
