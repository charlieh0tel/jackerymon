[package]
name = "jackerymon-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "jackerymon"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ecb = { version = "0.2.1", features = ["alloc"] }
env_logger = "0.11.11"
futures = "0.3.34"
jackerymon = { version = "0.1.0", path = "../jackerymon" }
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
rpassword = "7.5.4"
rsa = { version = "0.9.10", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
