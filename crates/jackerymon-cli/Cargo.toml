[package]
name = "jackerymon-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "jackerymon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
jackerymon = { version = "0.1.0", path = "../jackerymon" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[lints]
workspace = true
