<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jackery</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<div class="panel">
  <div class="controls">
    <h2>History</h2>
    <span class="grow"></span>
    <span id="ranges"></span>
  </div>
  <div id="charts"></div>
  <div id="note"></div>
</div>

<div class="panel">
  <h2>Unit</h2>
  <table id="unit"><tr><td class="muted">waiting...</td></tr></table>
</div>

<footer id="colophon"></footer>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script>
"use strict";

// The chart library comes from a CDN; without it the strip and the unit
// table still work, and the chart panel says why it is empty.
const haveUplot = typeof uPlot !== "undefined";
// Input and output in the TUI's colors; battery in the accent.
const INPUT = "#4ade80";
const AC_INPUT = "#a78bfa";
const CAR_INPUT = "#f472b6";
const SOLAR_INPUT = "#fb923c";
// The total input is a thin line over its sources, which should sum to it.
const TOTAL_WIDTH = 1;
const OUTPUT = "#fbbf24";
const BATTERY = "#38bdf8";
const TEMPERATURE = "#f87171";
// Dashes mark a line the unit does not report.
const ESTIMATE_DASH = [6, 4];
// About this many points per chart, whatever the window.
const POINTS = 1500;
// How often a window ending now is read again.
const CHART_EVERY = 30000;
const CHART_HEIGHT = 180;
// Y axes have a fixed width and label room, and a chart without a right
// axis reserves the same room on the right, so the charts' plot areas,
// and with them their time axes, line up.
const AXIS_SIZE = 60;
const AXIS_LABEL_SIZE = 30;
const RIGHT_ROOM = AXIS_SIZE + AXIS_LABEL_SIZE;
// How many divisions a chart's y axes may have; fewer first, so a tie
// takes the roomier.
const DIVISIONS = [3, 4];
// Round steps between ticks, times a power of ten.
const STEP_MANTISSAS = [1, 2, 2.5, 5];
// The smallest steps worth a tick: whole percent, half a degree.
const PERCENT_STEP = 1;
const CELSIUS_STEP = 0.5;
const FULL = 100;
// Hovering one chart moves the cursor on the others.
const SYNC = haveUplot ? uPlot.sync("jackerymon") : null;

let range = readRange();
let charts = [];

function clearCharts(why, bad = false) {
  for (const c of charts) c.destroy();
  charts = [];
  $("charts").innerHTML = "";
  $("note").textContent = bad ? why : "";
  if (!bad) $("charts").innerHTML = `<span class="muted">${esc(why)}</span>`;
}

function chart(title, data, series, axes, scales = {}) {
  const el = document.createElement("div");
  $("charts").appendChild(el);
  const right = axes.some((axis) => axis.side === 1);
  return new uPlot(
    {
      title,
      width: $("charts").clientWidth || 800,
      height: CHART_HEIGHT,
      // null leaves a side to uPlot, which pads nothing beside an axis.
      padding: [null, right ? null : RIGHT_ROOM, null, null],
      // No horizontal crosshair: the charts' y scales differ, and uPlot
      // parks a synced chart's line just above its plot, where it shows.
      cursor: { y: false, sync: { key: SYNC.key } },
      series: [{}, ...series],
      axes: [{ stroke: "#8b929c", grid: { stroke: "#2b3038" } }, ...axes],
      scales: { x: { time: true }, ...scales },
    },
    data,
    el,
  );
}

// A left y axis, with its gridlines.
const yAxis = (label, scale) => ({
  label, scale, size: AXIS_SIZE, labelSize: AXIS_LABEL_SIZE, stroke: "#8b929c", grid: { stroke: "#2b3038" },
});

// Decimals a tick needs at `step`: 0 for 5, 1 for 0.5, 2 for 0.25.
function stepDecimals(step) {
  let decimals = 0;
  while (Math.abs(step * 10 ** decimals - Math.round(step * 10 ** decimals)) > 1e-9) decimals++;
  return decimals;
}

// The smallest round step that is at least `least`.
function roundStep(least) {
  for (let power = Math.floor(Math.log10(least)); ; power++) {
    for (const mantissa of STEP_MANTISSAS) {
      const step = mantissa * 10 ** power;
      if (step >= least - 1e-9) return step;
    }
  }
}

// A range of `divisions` round steps covering [low, high], below
// `ceiling` when it can be.
function fit({ low, high, least, ceiling = Infinity }, divisions) {
  for (let step = roundStep(Math.max(least, (high - low) / divisions)); ; step = roundStep(step * 1.000001)) {
    const decimals = stepDecimals(step);
    let min = Number((Math.floor(low / step + 1e-9) * step).toFixed(decimals));
    if (min + divisions * step > ceiling && ceiling - divisions * step <= low) min = ceiling - divisions * step;
    const max = min + divisions * step;
    if (max >= high - 1e-9) return { min, max, step, decimals, divisions };
  }
}

// Ranges for a chart's left and right scales with the same number of
// divisions, so every gridline is a round number on both axes.  Each
// scale is { low, high } of its data, `least` its smallest step, and an
// optional `ceiling`.  A scale with no data is given [0, least].
function aligned(scales) {
  let best = null;
  for (const divisions of DIVISIONS) {
    const fits = scales.map((scale) => fit(scale, divisions));
    const waste = fits.reduce((sum, f, i) => sum + 1 - (scales[i].high - scales[i].low) / (f.max - f.min), 0);
    if (!best || waste < best.waste - 1e-9) best = { waste, fits };
  }
  return best.fits;
}

// The extent of a series, ignoring gaps.
function extent(values, least) {
  const present = values.filter((v) => v != null);
  return present.length
    ? { low: Math.min(...present), high: Math.max(...present), least }
    : { low: 0, high: least, least };
}

// The fixed scale and its ticks for one side of an aligned pair.
const alignedScale = (f) => ({ range: () => [f.min, f.max] });
const alignedTicks = (f) => ({
  splits: () => Array.from({ length: f.divisions + 1 }, (_, i) => Number((f.min + i * f.step).toFixed(f.decimals))),
  values: (u, ticks) => ticks.map((t) => t.toFixed(f.decimals)),
});

// A right y axis, on ticks aligned with the left's, so it draws no
// gridlines of its own.
const rightAxis = (label, scale) => ({
  label, scale, side: 1, size: AXIS_SIZE, labelSize: AXIS_LABEL_SIZE, stroke: "#8b929c", grid: { show: false },
});

async function load(signal) {
  if (!haveUplot) {
    clearCharts("the chart library could not be loaded from cdn.jsdelivr.net; the readings above still update", true);
    return;
  }
  const until = new Date();
  const since = new Date(until.getTime() - range * 1000);
  const every = Math.max(1, Math.round(range / POINTS));
  const q = new URLSearchParams({ since: since.toISOString(), until: until.toISOString(), every });
  const s = await ask(`/series?${q}`, signal);
  if (!s.time.length) {
    clearCharts("no samples logged in this window");
    return;
  }
  // The unit reports no battery power.  Input minus output overstates
  // charging and understates discharge by the losses and the unit's own
  // draw, so it is drawn as an estimate.
  const net = s.input_watts.map((input, i) =>
    input == null || s.output_watts[i] == null ? null : input - s.output_watts[i],
  );
  const [percent, celsius] = aligned([
    { ...extent(s.battery_percent, PERCENT_STEP), ceiling: FULL },
    extent(s.battery_celsius, CELSIUS_STEP),
  ]);
  // Each input source that delivered anything in the window.
  const sources = [
    ["AC input W", s.ac_input_watts, AC_INPUT],
    ["car input W", s.car_input_watts, CAR_INPUT],
    ["solar input W", s.solar_input_watts, SOLAR_INPUT],
  ].filter(([, values]) => values?.some((v) => v > 0));
  clearCharts("");
  charts = [
    chart(
      "Power",
      [s.time, ...sources.map(([, values]) => values), s.input_watts, s.output_watts, net],
      [
        ...sources.map(([label, , stroke]) => ({ label, stroke, scale: "W" })),
        { label: "input W", stroke: INPUT, width: TOTAL_WIDTH, scale: "W" },
        { label: "output W", stroke: OUTPUT, scale: "W" },
        { label: "battery W, estimated (in − out)", stroke: BATTERY, dash: ESTIMATE_DASH, scale: "W" },
      ],
      [yAxis("W", "W")],
    ),
    chart(
      "Battery",
      [s.time, s.battery_percent, s.battery_celsius],
      [
        { label: "charge %", stroke: BATTERY, scale: "%" },
        { label: "temperature °C", stroke: TEMPERATURE, scale: "°C" },
      ],
      [
        { ...yAxis("%", "%"), ...alignedTicks(percent) },
        { ...rightAxis("°C", "°C"), ...alignedTicks(celsius) },
      ],
      { "%": alignedScale(percent), "°C": alignedScale(celsius) },
    ),
  ];
}

// The unit's settings and inputs as the strip last read them; nothing
// here can be changed from the page.
function unitTable(s) {
  if (!s?.view) {
    $("unit").innerHTML = `<tr><td class="muted">${s ? "no reading yet" : "no daemon"}</td></tr>`;
    return;
  }
  const v = s.view;
  const acOut = v.ac_output === "on" && v.ac_output_volts != null
    ? `on, ${fmt(v.ac_output_volts, 1)} V ${fmt(v.ac_output_hertz)} Hz`
    : v.ac_output;
  const rows = [
    ["AC output", acOut],
    ["DC output", v.dc_output],
    ["USB output", v.usb_output],
    ["car output", v.car_output],
    ["AC input", unitText(v.ac_input_watts, "W")],
    ["car input", unitText(v.car_input_watts, "W")],
    ["solar input", unitText(v.solar_input_watts, "W", 1)],
    ["light", v.light],
    ["screen", v.screen],
    ["auto-off", v.auto_off],
    ["energy saving", v.energy_saving],
    ["charge speed", v.charge_speed],
    ["battery protection", v.battery_protection],
    ["emergency charge", v.emergency_charge],
    ["UPS", v.ups],
    ["fault", v.fault],
  ];
  // A field the unit does not report is left out, not shown as "--".
  $("unit").innerHTML = rows
    .filter(([, value]) => value !== null && value !== undefined && value !== MISSING)
    .map(([k, value]) => `<tr><th>${esc(k)}</th><td>${esc(value)}</td></tr>`)
    .join("");
}

rangeControl($("ranges"), range, (last) => {
  range = last;
  renew();
});
// Charts follow the panel's width, all at once.  The panel narrows when
// a scrollbar appears, which drawing the first chart can cause, so a
// window resize alone would leave the charts different widths.
new ResizeObserver(() => {
  for (const c of charts) c.setSize({ width: $("charts").clientWidth, height: CHART_HEIGHT });
}).observe($("charts"));

content({
  load,
  clear: clearCharts,
  every: CHART_EVERY,
  auto: () => true,
  status: unitTable,
});
</script>
