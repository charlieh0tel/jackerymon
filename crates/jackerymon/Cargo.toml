[package]
name = "jackerymon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Monitor and control Jackery Explorer power stations over BLE"

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.34"
log = "0.4.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time", "macros", "rt", "sync"] }
uuid = "1.28.0"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
