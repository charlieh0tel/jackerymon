name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      build-deps: "libdbus-1-dev pkg-config"
      check-args: "--workspace --all-targets"
      # Format with the pinned toolchain's rustfmt, as developers do.
      fmt-toolchain: ""
